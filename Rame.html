            .join('');
        }
      },

      openSaved(id) {
        const exam = Storage.getSavedExams().find((e) => e.id === id);
        if (!exam) return;
        ReviewUI.open(JSON.parse(JSON.stringify(exam)));
      },

      deleteSaved(id) {
        Storage.deleteSavedExam(id);
        this.render();
        UI.toast('Đã xóa đề');
      },

      deleteHistory(id) {
        Storage.deleteHistoryItem(id);
        this.render();
      },
    };

    /**
     * ============================================================================
     * 5. REVIEW & CONFIG UI (DUYỆT ĐỀ - CỠ CHỮ TO RÕ)
     * ============================================================================
     */
    const ReviewUI = {
      exam: null,
      mode: 'exam',
      onlyMissing: false,

      open(exam) {
        this.exam = exam;
        this.onlyMissing = false;
        document.getElementById('cfg-title').value = exam.title || '';
        document.getElementById('cfg-duration').value = exam.duration || 15;
        this.setMode(this.mode);
        this.render();
        App.switchView('review');
      },

      setMode(mode) {
        this.mode = mode;
        const btnExam = document.getElementById('mode-btn-exam');
        const btnPractice = document.getElementById('mode-btn-practice');
        if (mode === 'exam') {
          btnExam.className = 'px-3.5 py-1.5 rounded-lg bg-white text-slate-900 font-semibold shadow-xs transition-all';
          btnPractice.className = 'px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all';
        } else {
          btnPractice.className = 'px-3.5 py-1.5 rounded-lg bg-white text-slate-900 font-semibold shadow-xs transition-all';
          btnExam.className = 'px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all';
        }
      },

      toggleMissingFilter() {
        this.onlyMissing = !this.onlyMissing;
        this.render();
      },

      render() {
        if (!this.exam) return;
        const qs = this.exam.questions;
        const total = qs.length;
        const missing = qs.filter((q) => q.correctIndex < 0 || q.correctIndex > 3).length;

        // Thống kê nguồn nhận diện đáp án
        const byTable = qs.filter((q) => q.source === 'table').length;
        const byFormat = qs.filter((q) => q.source === 'format').length;
        const byAst = qs.filter((q) => q.source === 'asterisk').length;
        const sourceBadge = document.getElementById('review-source-badge');

        const parts = [];
        if (byTable > 0) parts.push(`${byTable} từ bảng đáp án`);
        if (byFormat > 0) parts.push(`${byFormat} từ định dạng`);
        if (byAst > 0) parts.push(`${byAst} từ dấu *`);

        if (parts.length > 0) {
          sourceBadge.textContent = `Tự nhận: ${parts.join(', ')}`;
          sourceBadge.classList.remove('hidden');
        } else {
          sourceBadge.classList.add('hidden');
        }

        const statusEl = document.getElementById('review-status-text');
        statusEl.innerHTML =
          missing > 0
            ? `${total} câu · <span class="text-[#DC2626] font-bold">${missing} thiếu đáp án</span>`
            : `${total} câu · <span class="text-[#16A34A] font-semibold">Đủ đáp án</span>`;

        const filterBtn = document.getElementById('btn-filter-missing');
        if (missing > 0 || this.onlyMissing) {
          filterBtn.classList.remove('hidden');
          filterBtn.textContent = this.onlyMissing ? 'Hiện tất cả' : 'Lọc thiếu đáp án';
          filterBtn.className = this.onlyMissing
            ? 'px-3 py-1 rounded-lg bg-[#DC2626] text-white font-semibold transition-colors'
            : 'px-3 py-1 rounded-lg border border-red-200 bg-red-50 text-[#DC2626] hover:bg-red-100 font-semibold transition-colors';
        } else {
          filterBtn.classList.add('hidden');
        }

        const listEl = document.getElementById('review-questions-list');
        const visible = qs
          .map((q, idx) => ({ q, idx }))
          .filter(({ q }) => !this.onlyMissing || q.correctIndex < 0 || q.correctIndex > 3);

        if (visible.length === 0) {
          listEl.innerHTML = `<div class="liquid-glass rounded-2xl p-8 text-center text-sm text-slate-500">Không có câu hỏi nào cần hiển thị.</div>`;
          return;
        }

        listEl.innerHTML = visible
          .map(({ q, idx }) => {
            const isMissing = q.correctIndex < 0 || q.correctIndex > 3;
            return `
            <div class="liquid-glass rounded-2xl p-5 sm:p-6 ${isMissing ? 'border-red-300 ring-1 ring-red-200/80' : ''}">
              <div class="flex items-center justify-between gap-3 mb-3.5">
                <div class="flex items-center gap-2.5 flex-wrap">
                  <span class="inline-flex items-center px-3.5 py-1 rounded-xl text-lg sm:text-xl font-bold tracking-tight ${
                    isMissing
                      ? 'bg-red-50 text-[#DC2626] border border-red-200'
                      : 'bg-blue-50/90 text-[#2563EB] border border-blue-200/80'
                  }">
                    Câu ${idx + 1}
                  </span>
                  ${isMissing ? `<span class="text-xs font-semibold text-[#DC2626] bg-red-50 px-2.5 py-1 rounded-lg">Chưa chọn đáp án đúng</span>` : ''}
                </div>
                <button
                  type="button"
                  onclick="ReviewUI.deleteQuestion(${idx})"
                  class="p-2 rounded-xl text-slate-400 hover:text-[#DC2626] hover:bg-red-50 transition-colors"
                  title="Xóa câu hỏi"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </div>

              <!-- Nội dung câu hỏi cỡ lớn -->
              <textarea
                rows="2"
                oninput="ReviewUI.updateQuestionText(${idx}, this.value)"
                placeholder="Nhập nội dung câu hỏi..."
                class="w-full p-3.5 text-lg sm:text-xl font-semibold leading-relaxed text-slate-900 bg-white/80 focus:bg-white border border-slate-200/90 focus:border-[#2563EB] rounded-xl outline-none resize-y mb-4"
              >${Utils.escapeHtml(q.text)}</textarea>

              <!-- 4 Đáp án A/B/C/D -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${[0, 1, 2, 3]
                  .map((oi) => {
                    const isCorrect = q.correctIndex === oi;
                    return `
                    <div class="flex items-center gap-2.5 p-2 rounded-xl border transition-colors ${
                      isCorrect ? 'bg-emerald-50/90 border-emerald-300' : 'bg-white/75 border-slate-200/80'
                    }">
                      <button
                        type="button"
                        onclick="ReviewUI.setCorrect(${idx}, ${oi})"
                        title="Chọn làm đáp án đúng"
                        class="w-9 h-9 rounded-lg text-sm font-bold shrink-0 transition-all ${
                          isCorrect
                            ? 'bg-[#16A34A] text-white shadow-xs'
                            : 'bg-slate-100 text-slate-600 hover:bg-blue-100 hover:text-[#2563EB]'
                        }"
                      >
                        ${Utils.letterOf(oi)}
                      </button>
                      <input
                        type="text"
                        value="${Utils.escapeHtml(q.options[oi] || '')}"
                        oninput="ReviewUI.updateOptionText(${idx}, ${oi}, this.value)"
                        placeholder="Đáp án ${Utils.letterOf(oi)}"
                        class="flex-1 min-w-0 bg-transparent text-base text-slate-800 outline-none py-1 pr-2"
                      />
                    </div>`;
                  })
                  .join('')}
              </div>
            </div>`;
          })
          .join('');
      },

      updateQuestionText(qIdx, val) {
        this.exam.questions[qIdx].text = val;
      },

      updateOptionText(qIdx, optIdx, val) {
        this.exam.questions[qIdx].options[optIdx] = val;
      },

      setCorrect(qIdx, optIdx) {
        this.exam.questions[qIdx].correctIndex = optIdx;
        this.exam.questions[qIdx].source = 'manual';
        this.render();
      },

      deleteQuestion(qIdx) {
        if (this.exam.questions.length <= 1) {
          UI.toast('Đề thi phải có ít nhất 1 câu hỏi', 'error');
          return;
        }
        this.exam.questions.splice(qIdx, 1);
        this.render();
      },

      addQuestion() {
        this.exam.questions.push({
          id: Utils.uid(),
          text: '',
          options: ['', '', '', ''],
          correctIndex: -1,
          source: 'manual',
        });
        this.onlyMissing = false;
        this.render();
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      },

      tryStartExam() {
        const title = document.getElementById('cfg-title').value.trim() || 'Đề trắc nghiệm';
        const duration = Math.max(1, Math.min(300, parseInt(document.getElementById('cfg-duration').value, 10) || 15));
        this.exam.title = title;
        this.exam.duration = duration;

        const missing = this.exam.questions.filter((q) => q.correctIndex < 0 || q.correctIndex > 3).length;
        const startNow = () => {
          const saved = Storage.saveExam(this.exam);
          this.exam.id = saved.id;
          ExamEngine.start({
            exam: saved,
            mode: this.mode,
            shuffleQuestions: document.getElementById('cfg-shuffle-q').checked,
            shuffleOptions: document.getElementById('cfg-shuffle-opt').checked,
          });
        };

        if (missing > 0) {
          UI.confirm({
            title: `Còn ${missing} câu chưa có đáp án`,
            body: 'Các câu chưa chọn đáp án đúng sẽ không được tính điểm. Bạn vẫn muốn bắt đầu làm bài?',
            confirmText: 'Vẫn bắt đầu',
            onConfirm: startNow,
          });
        } else {
          startNow();
        }
      },
    };

    /**
     * ============================================================================
     * 6. QUICK ANSWER MODAL (DÁN ĐÁP ÁN + NHẬP TỪ FILE .DOCX, .TXT)
     * ============================================================================
     */
    const QuickAnswerModal = {
      bindEvents() {
        const input = document.getElementById('quick-answer-input');
        const fileInput = document.getElementById('answer-file-input');

        input.addEventListener('input', () => this.updateCount());
        fileInput.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          fileInput.value = '';
          if (!file) return;

          try {
            const keyMap = await FileParser.extractAnswerKeysFromFile(file);
            const nums = Object.keys(keyMap)
              .map((n) => parseInt(n, 10))
              .sort((a, b) => a - b);

            if (nums.length === 0) {
              UI.toast('Không tìm thấy đáp án nào trong tệp', 'error');
              return;
            }

            const formatted = nums.map((n) => `${n}.${keyMap[n]}`).join(' ');
            input.value = formatted;
            this.updateCount();
            UI.toast(`Đã trích xuất ${nums.length} đáp án từ tệp`, 'success');
          } catch (err) {
            UI.toast(err.message || 'Không thể đọc tệp đáp án', 'error');
          }
        });
      },

      open() {
        const input = document.getElementById('quick-answer-input');
        input.value = '';
        this.updateCount();
        document.getElementById('quick-answer-modal').classList.remove('hidden');
        setTimeout(() => input.focus(), 60);
      },

      close() {
        document.getElementById('quick-answer-modal').classList.add('hidden');
      },

      updateCount() {
        const raw = document.getElementById('quick-answer-input').value.trim();
        const countEl = document.getElementById('quick-answer-count');
        const count = raw ? Object.keys(FileParser.parseQuickAnswerText(raw)).length : 0;
        countEl.textContent = `Nhận diện: ${count} đáp án`;
        countEl.className =
          count > 0
            ? 'text-xs font-semibold px-2.5 py-1 rounded-lg bg-emerald-50 text-[#16A34A] border border-emerald-200/80'
            : 'text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600';
      },

      apply() {
        const raw = document.getElementById('quick-answer-input').value.trim();
        if (!raw) {
          UI.toast('Vui lòng dán hoặc nhập file đáp án', 'error');
          return;
        }
        const keyMap = FileParser.parseQuickAnswerText(raw);
        const letters = ['A', 'B', 'C', 'D'];
        let applied = 0;

        ReviewUI.exam.questions.forEach((q, idx) => {
          const letter = keyMap[idx + 1];
          if (letter) {
            const oi = letters.indexOf(letter);
            if (oi >= 0) {
              q.correctIndex = oi;
              q.source = 'table';
              applied++;
            }
          }
        });

        this.close();
        ReviewUI.render();
        UI.toast(applied > 0 ? `Đã áp dụng ${applied} đáp án` : 'Không khớp được đáp án nào', applied > 0 ? 'success' : 'error');
      },
    };

    /**
     * ============================================================================
     * 7. EXAM ENGINE & EXAM UI (LÀM BÀI 2 CỘT + ẨN/HIỆN BẢNG + CỠ CHỮ TO RÕ)
     * ============================================================================
     */
    const ExamEngine = {
      session: null,
      timerId: null,

      start({ exam, mode, shuffleQuestions, shuffleOptions }) {
        let prepared = exam.questions.map((q) => {
          let optionPairs = q.options.map((text, idx) => ({ text, isCorrect: idx === q.correctIndex }));
          if (shuffleOptions) optionPairs = Utils.shuffleArray(optionPairs);
          const newCorrectIdx = optionPairs.findIndex((o) => o.isCorrect);
          return {
            id: q.id,
            text: q.text,
            options: optionPairs.map((o) => o.text),
            correctIndex: newCorrectIdx,
          };
        });

        if (shuffleQuestions) prepared = Utils.shuffleArray(prepared);

        const totalSec = (exam.duration || 15) * 60;
        this.session = {
          id: Utils.uid(),
          examId: exam.id,
          title: exam.title,
          mode,
          durationMinutes: exam.duration || 15,
          totalSeconds: totalSec,
          remainingSeconds: totalSec,
          startedAt: Date.now(),
          questions: prepared,
          answers: {},
          flags: {},
          submitted: false,
        };

        Storage.setActiveSession(this.session);
        ExamUI.isSidebarHidden = false;
        ExamUI.renderAll();
        App.switchView('exam');
        this.startTimer();
      },

      resume(savedSession) {
        this.session = savedSession;
        ExamUI.isSidebarHidden = false;
        ExamUI.renderAll();
        App.switchView('exam');
        this.startTimer();
      },
      confirmSubmit() {
        if (!this.session || this.session.submitted) return;
        const total = this.session.questions.length;
        const answered = Object.keys(this.session.answers).length;
        const unanswered = total - answered;

        UI.confirm({
          title: 'Nộp bài thi?',
          body:
            unanswered > 0
              ? `Bạn còn <strong>${unanswered}/${total}</strong> câu chưa trả lời. Bạn có chắc muốn nộp bài ngay?`
              : `Bạn đã trả lời đủ <strong>${total}/${total}</strong> câu. Xác nhận nộp bài?`,
          confirmText: 'Nộp bài',
          onConfirm: () => this.submit(),
        });
      },

      requestSubmit() {
        this.confirmSubmit();
      },

      startTimer() {
        this.pauseTimer();
        ExamUI.updateTimers(this.session.remainingSeconds);

        this.timerId = setInterval(() => {
          if (!this.session || this.session.submitted) {
            this.pauseTimer();
            return;
          }
          this.session.remainingSeconds = Math.max(0, this.session.remainingSeconds - 1);
          ExamUI.updateTimers(this.session.remainingSeconds);

          if (this.session.remainingSeconds % 5 === 0) {
            Storage.setActiveSession(this.session);
          }

          if (this.session.remainingSeconds <= 0) {
            this.pauseTimer();
            UI.toast('Hết giờ làm bài! Hệ thống tự động nộp bài.', 'info');
            this.submit();
          }
        }, 1000);
      },

      pauseTimer() {
        if (this.timerId) {
          clearInterval(this.timerId);
          this.timerId = null;
        }
      },

      selectOption(qId, optIdx) {
        if (!this.session || this.session.submitted) return;
        this.session.answers[qId] = optIdx;
        Storage.setActiveSession(this.session);
        ExamUI.updateQuestionCard(qId);
        ExamUI.renderAnswerSheets();
      },

      toggleFlag(qId) {
        if (!this.session || this.session.submitted) return;
        this.session.flags[qId] = !this.session.flags[qId];
        Storage.setActiveSession(this.session);
        ExamUI.updateQuestionCard(qId);
        ExamUI.renderAnswerSheets();
      },

      requestSubmit() {
        if (!this.session || this.session.submitted) return;
        const total = this.session.questions.length;
        const answered = Object.keys(this.session.answers).length;
        const unanswered = total - answered;

        UI.confirm({
          title: 'Nộp bài thi?',
          body:
            unanswered > 0
              ? `Bạn còn <strong>${unanswered}/${total}</strong> câu chưa trả lời. Bạn có chắc muốn nộp bài ngay?`
              : `Bạn đã trả lời đủ <strong>${total}/${total}</strong> câu. Xác nhận nộp bài?`,
          confirmText: 'Nộp bài',
          onConfirm: () => this.submit(),
        });
      },

      submit() {
        if (!this.session || this.session.submitted) return;
        this.pauseTimer();
        this.session.submitted = true;

        const qs = this.session.questions;
        let correctCount = 0;
        qs.forEach((q) => {
          const chosen = this.session.answers[q.id];
          if (chosen !== undefined && chosen === q.correctIndex) correctCount++;
        });

        const totalCount = qs.length;
        const score = totalCount > 0 ? Math.round((correctCount / totalCount) * 1000) / 100 : 0;
        const timeSpent = Math.max(1, this.session.totalSeconds - this.session.remainingSeconds);

        const resultRecord = {
          id: Utils.uid(),
          examId: this.session.examId,
          title: this.session.title,
          mode: this.session.mode,
          durationMinutes: this.session.durationMinutes,
          score,
          correctCount,
          totalCount,
          timeSpent,
          finishedAt: new Date().toISOString(),
          questions: qs,
          answers: { ...this.session.answers },
        };

        Storage.addHistory(resultRecord);
        Storage.setActiveSession(null);
        ResultUI.open(resultRecord);
      },
    };

    const ExamUI = {
      isSidebarHidden: false,

      renderAll() {
        const s = ExamEngine.session;
        if (!s) return;
        document.getElementById('header-exam-title').textContent = s.title;
        this.syncSidebarLayout();
        this.renderQuestions();
        this.renderAnswerSheets();
        this.updateTimers(s.remainingSeconds);
      },

      hideDesktopPanel() {
        this.isSidebarHidden = true;
        this.syncSidebarLayout();
      },

      showPanel() {
        if (window.innerWidth < 1024) {
          this.toggleMobileSheet(true);
        } else {
          this.isSidebarHidden = false;
          this.syncSidebarLayout();
        }
      },

      syncSidebarLayout() {
        const sidebar = document.getElementById('exam-sidebar');
        const col = document.getElementById('exam-questions-col');
        const showBtn = document.getElementById('btn-show-sidebar');
        if (!sidebar || !col || !showBtn) return;

        const isDesktop = window.innerWidth >= 1024;

        if (isDesktop) {
          if (this.isSidebarHidden) {
            sidebar.style.display = 'none';
            col.classList.remove('lg:w-[70%]');
            col.classList.add('max-w-4xl', 'mx-auto');
            showBtn.style.display = 'inline-flex';
          } else {
            sidebar.style.display = 'block';
            col.classList.add('lg:w-[70%]');
            col.classList.remove('max-w-4xl', 'mx-auto');
            showBtn.style.display = 'none';
          }
        } else {
          sidebar.style.display = 'none';
          col.classList.remove('lg:w-[70%]', 'max-w-4xl', 'mx-auto');
          showBtn.style.display = 'inline-flex';
        }
      },

      updateTimers(seconds) {
        const formatted = Utils.formatTime(seconds);
        const isDanger = seconds <= 60;

        ['desktop-timer', 'header-mini-timer'].forEach((id) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.textContent = formatted;
          if (isDanger) {
            el.classList.add('text-[#DC2626]');
            el.classList.remove('text-[#2563EB]');
          } else {
            el.classList.add('text-[#2563EB]');
            el.classList.remove('text-[#DC2626]');
          }
        });
      },

      renderQuestions() {
        const s = ExamEngine.session;
        const container = document.getElementById('exam-questions-container');
        container.innerHTML = s.questions
          .map((q, idx) => `<div id="exam-q-${q.id}" class="scroll-mt-24">${this.buildQuestionCardHtml(q, idx)}</div>`)
          .join('');
      },

      updateQuestionCard(qId) {
        const s = ExamEngine.session;
        const idx = s.questions.findIndex((q) => q.id === qId);
        if (idx < 0) return;
        const wrap = document.getElementById(`exam-q-${qId}`);
        if (wrap) wrap.innerHTML = this.buildQuestionCardHtml(s.questions[idx], idx);
      },

      buildQuestionCardHtml(q, idx) {
        const s = ExamEngine.session;
        const chosen = s.answers[q.id];
        const flagged = !!s.flags[q.id];
        const isPracticeRevealed = s.mode === 'practice' && chosen !== undefined;

        return `
          <article class="liquid-glass rounded-2xl p-5 sm:p-7 ${flagged ? 'border-amber-300 ring-1 ring-amber-200/80' : ''}">
            <!-- Hàng tiêu đề: Nhãn Câu 1..n to rõ + Nút Cắm cờ -->
            <div class="flex items-center justify-between gap-3 mb-4">
              <span class="inline-flex items-center px-3.5 py-1 rounded-xl bg-blue-50/90 text-[#2563EB] border border-blue-200/80 text-lg sm:text-xl font-bold tracking-tight">
                Câu ${idx + 1}
              </span>

              <button
                type="button"
                onclick="ExamEngine.toggleFlag('${q.id}')"
                class="liquid-glass lg-interactive px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold inline-flex items-center gap-1.5 ${
                  flagged ? 'bg-amber-50/95 border-amber-300 text-[#D97706]' : 'text-slate-500 hover:text-slate-800'
                }"
              >
                <svg class="w-4 h-4" fill="${flagged ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9" />
                </svg>
                <span>${flagged ? 'Đã cắm cờ' : 'Xem lại'}</span>
              </button>
            </div>

            <!-- Nội dung câu hỏi cỡ lớn dễ đọc -->
            <h3 class="text-xl sm:text-2xl font-semibold leading-relaxed text-slate-900 whitespace-pre-line mb-5">${Utils.escapeHtml(q.text)}</h3>

            <!-- Danh sách 4 đáp án cân đối -->
            <div class="space-y-3">
              ${q.options
                .map((optText, oi) => {
                  const isSelected = chosen === oi;
                  let cardStyle = 'bg-white/75 text-slate-800';
                  let badgeStyle = 'bg-slate-100 text-slate-700 border border-slate-200/90';

                  if (isPracticeRevealed) {
                    if (oi === q.correctIndex) {
                      cardStyle = 'bg-emerald-50/95 border-emerald-400 text-emerald-950';
                      badgeStyle = 'bg-[#16A34A] text-white border-transparent';
                    } else if (isSelected && oi !== q.correctIndex) {
                      cardStyle = 'bg-red-50/95 border-red-400 text-red-950';
                      badgeStyle = 'bg-[#DC2626] text-white border-transparent';
                    }
                  } else if (isSelected) {
                    cardStyle = 'bg-blue-50/95 border-[#2563EB] text-blue-950 ring-1 ring-blue-500/20';
                    badgeStyle = 'bg-[#2563EB] text-white border-transparent';
                  }

                  return `
                    <button
                      type="button"
                      onclick="ExamEngine.selectOption('${q.id}', ${oi})"
                      class="liquid-glass lg-interactive lg-lift w-full text-left p-3.5 sm:p-4 rounded-2xl flex items-start gap-3.5 ${cardStyle}"
                    >
                      <span class="w-10 h-10 rounded-full text-base sm:text-lg font-bold flex items-center justify-center shrink-0 transition-colors ${badgeStyle}">
                        ${Utils.letterOf(oi)}
                      </span>
                      <span class="text-base sm:text-lg leading-relaxed pt-1.5 break-words flex-1">${Utils.escapeHtml(optText)}</span>
                    </button>`;
                })
                .join('')}
            </div>
          </article>`;
      },

      renderAnswerSheets() {
        const s = ExamEngine.session;
        if (!s) return;
        const total = s.questions.length;
        const answered = Object.keys(s.answers).length;
        const progressText = `${answered}/${total}`;

        document.getElementById('desktop-progress-text').textContent = progressText;
        const miniProg = document.getElementById('header-mini-progress');
        if (miniProg) miniProg.textContent = progressText;
        const mobileProg = document.getElementById('mobile-sheet-progress');
        if (mobileProg) mobileProg.textContent = progressText;

        const html = s.questions
          .map((q, idx) => {
            const isAnswered = s.answers[q.id] !== undefined;
            const isFlagged = !!s.flags[q.id];
            let cls = 'bg-white/85 border border-slate-200 text-slate-700 hover:border-blue-400';
            if (isFlagged) cls = 'bg-[#F59E0B] text-white border border-amber-500 shadow-xs';
            else if (isAnswered) cls = 'bg-[#2563EB] text-white border border-blue-600 shadow-xs';

            return `
              <button
                type="button"
                onclick="ExamUI.scrollToQuestion('${q.id}')"
                class="h-9 rounded-xl text-xs font-bold transition-all ${cls}"
              >
                ${idx + 1}
              </button>`;
          })
          .join('');

        document.getElementById('desktop-answer-sheet').innerHTML = html;
        document.getElementById('mobile-answer-sheet').innerHTML = html;
      },

      scrollToQuestion(qId) {
        this.toggleMobileSheet(false);
        const el = document.getElementById(`exam-q-${qId}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },

      toggleMobileSheet(open) {
        const sheet = document.getElementById('mobile-sheet-modal');
        sheet.classList.toggle('hidden', !open);
      },
    };

    /**
     * ============================================================================
     * 8. RESULT & DETAILED REVIEW UI (KẾT QUẢ - CỠ CHỮ TO RÕ)
     * ============================================================================
     */
    const ResultUI = {
      result: null,
      filter: 'all',

      open(resultRecord) {
        this.result = resultRecord;
        this.filter = 'all';

        document.getElementById('res-score').textContent = Number(resultRecord.score).toFixed(2);
        document.getElementById('res-exam-title').textContent = resultRecord.title;
        document.getElementById('res-correct').textContent = `${resultRecord.correctCount}/${resultRecord.totalCount}`;
        document.getElementById('res-duration').textContent = Utils.formatTime(resultRecord.timeSpent);

        const wrongCount = resultRecord.questions.filter((q) => {
          const chosen = resultRecord.answers[q.id];
          return chosen === undefined || chosen !== q.correctIndex;
        }).length;

        const retryWrongBtn = document.getElementById('btn-retry-wrong');
        if (wrongCount > 0) {
          document.getElementById('retry-wrong-count').textContent = wrongCount;
          retryWrongBtn.classList.remove('hidden');
        } else {
          retryWrongBtn.classList.add('hidden');
        }

        this.setFilter('all');
        App.switchView('result');
      },

      setFilter(filter) {
        this.filter = filter;
        document.querySelectorAll('.res-filter-btn').forEach((btn) => {
          const active = btn.dataset.filter === filter;
          btn.className = active
            ? 'res-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-[#2563EB] text-white transition-colors'
            : 'res-filter-btn liquid-glass lg-interactive px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-700';
        });
        this.renderList();
      },

      renderList() {
        if (!this.result) return;
        const container = document.getElementById('result-review-list');
        const items = this.result.questions
          .map((q, idx) => {
            const chosen = this.result.answers[q.id];
            const isUnanswered = chosen === undefined;
            const isCorrect = !isUnanswered && chosen === q.correctIndex;
            const status = isUnanswered ? 'unanswered' : isCorrect ? 'correct' : 'wrong';
            return { q, idx, chosen, status };
          })
          .filter((item) => {
            if (this.filter === 'all') return true;
            return item.status === this.filter;
          });

        if (items.length === 0) {
          container.innerHTML = `<div class="liquid-glass rounded-2xl p-8 text-center text-sm text-slate-500">Không có câu hỏi nào trong mục này.</div>`;
          return;
        }

        container.innerHTML = items
          .map(({ q, idx, chosen, status }) => {
            const statusBadge =
              status === 'correct'
                ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-50 text-[#16A34A] border border-emerald-200 text-xs font-bold">Đúng</span>`
                : status === 'wrong'
                ? `<span class="px-2.5 py-1 rounded-lg bg-red-50 text-[#DC2626] border border-red-200 text-xs font-bold">Sai</span>`
                : `<span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 border border-slate-200 text-xs font-bold">Chưa làm</span>`;

            return `
              <article class="liquid-glass rounded-2xl p-5 sm:p-7">
                <div class="flex items-center justify-between gap-3 mb-4">
                  <span class="inline-flex items-center px-3.5 py-1 rounded-xl bg-blue-50/90 text-[#2563EB] border border-blue-200/80 text-lg sm:text-xl font-bold tracking-tight">
                    Câu ${idx + 1}
                  </span>
                  ${statusBadge}
                </div>

                <!-- Nội dung câu hỏi cỡ lớn -->
                <h3 class="text-xl sm:text-2xl font-semibold leading-relaxed text-slate-900 whitespace-pre-line mb-5">${Utils.escapeHtml(q.text)}</h3>

                <!-- Danh sách đáp án -->
                <div class="space-y-3">
                  ${q.options
                    .map((optText, oi) => {
                      const isCorrectOpt = oi === q.correctIndex;
                      const isChosenWrong = chosen === oi && oi !== q.correctIndex;

                      let rowCls = 'bg-white/75 border-slate-200/80 text-slate-700';
                      let badgeCls = 'bg-slate-100 text-slate-600';

                      if (isCorrectOpt) {
                        rowCls = 'bg-emerald-50/95 border-emerald-400 text-emerald-950 font-medium';
                        badgeCls = 'bg-[#16A34A] text-white';
                      } else if (isChosenWrong) {
                        rowCls = 'bg-red-50/95 border-red-400 text-red-950 font-medium';
                        badgeCls = 'bg-[#DC2626] text-white';
                      }

                      return `
                        <div class="p-3.5 sm:p-4 rounded-2xl border flex items-start gap-3.5 ${rowCls}">
                          <span class="w-10 h-10 rounded-full text-base sm:text-lg font-bold flex items-center justify-center shrink-0 ${badgeCls}">
                            ${Utils.letterOf(oi)}
                          </span>
                          <span class="text-base sm:text-lg leading-relaxed pt-1.5 flex-1 break-words">${Utils.escapeHtml(optText)}</span>
                        </div>`;
                    })
                    .join('')}
                </div>
              </article>`;
          })
          .join('');
      },

      retryWrongQuestions() {
        if (!this.result) return;
        const wrongQs = this.result.questions
          .filter((q) => {
            const chosen = this.result.answers[q.id];
            return chosen === undefined || chosen !== q.correctIndex;
          })
          .map((q) => ({ ...q, id: Utils.uid() }));

        if (wrongQs.length === 0) return;

        ExamEngine.start({
          exam: {
            id: this.result.examId,
            title: `${this.result.title} (Ôn câu sai)`,
            duration: Math.max(5, Math.ceil(wrongQs.length * 1.5)),
            questions: wrongQs,
          },
          mode: 'practice',
          shuffleQuestions: false,
          shuffleOptions: false,
        });
      },

      retryFullExam() {
        if (!this.result) return;
        ExamEngine.start({
          exam: {
            id: this.result.examId,
            title: this.result.title,
            duration: this.result.durationMinutes || 15,
            questions: this.result.questions.map((q) => ({ ...q, id: Utils.uid() })),
          },
          mode: this.result.mode || 'exam',
          shuffleQuestions: false,
          shuffleOptions: false,
        });
      },
    };

    /**
     * ============================================================================
     * 9. UI HELPERS (CUSTOM MODAL & TOAST)
     * ============================================================================
     */
    const UI = {
      onConfirmCallback: null,

      confirm({ title, body, confirmText = 'Đồng ý', danger = false, onConfirm }) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = body;
        const confirmBtn = document.getElementById('modal-confirm-btn');
        confirmBtn.textContent = confirmText;
        confirmBtn.className = danger
          ? 'px-4 py-2 rounded-xl bg-[#DC2626] hover:bg-red-700 text-white text-xs font-semibold transition-colors'
          : 'px-4 py-2 rounded-xl bg-[#2563EB] hover:bg-blue-700 text-white text-xs font-semibold transition-colors';

        this.onConfirmCallback = onConfirm;
        confirmBtn.onclick = () => {
          const cb = this.onConfirmCallback;
          this.closeModal();
          if (cb) cb();
        };

        document.getElementById('confirm-modal').classList.remove('hidden');
      },

      closeModal() {
        document.getElementById('confirm-modal').classList.add('hidden');
        this.onConfirmCallback = null;
      },

      toast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        const colorCls =
          type === 'success'
            ? 'bg-emerald-600 text-white'
            : type === 'error'
            ? 'bg-red-600 text-white'
            : 'bg-slate-900 text-white';

        el.className = `pointer-events-auto px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium shadow-lg transition-all duration-300 opacity-0 translate-y-2 ${colorCls}`;
        el.textContent = message;
        container.appendChild(el);

        requestAnimationFrame(() => {
          el.classList.remove('opacity-0', 'translate-y-2');
        });

        setTimeout(() => {
          el.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => el.remove(), 300);
        }, 2800);
      },
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
